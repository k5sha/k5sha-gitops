apiVersion: apps/v1
kind: Deployment
metadata:
  name: tg-bot
  namespace: tg-bot
  labels:
    app: tg-bot
spec:
  replicas: 1 
  strategy:
    type: Recreate 
  selector:
    matchLabels:
      app: tg-bot
  template:
    metadata:
      labels:
        app: tg-bot
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
      - name: bot
        image: ghcr.io/k5sha/tg-downloader-bot:ad07c30
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        env:
        - name: WEB_SERVER_HOST
          value: "0.0.0.0"
        - name: WEB_SERVER_PORT
          value: "8080"
        - name: BASE_WEBHOOK_URL
          value: "https://api.k5sha.com"
        - name: WEBHOOK_PATH
          value: "/tg-bot/webhook"
        - name: BOT_TOKEN
          valueFrom:
            secretKeyRef:
              name: tg-bot-secrets
              key: bot_token
        - name: WEBHOOK_SECRET
          valueFrom:
            secretKeyRef:
              name: tg-bot-secrets
              key: webhook_secret
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 60
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            memory: "128Mi" 
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}